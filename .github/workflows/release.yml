name: Publish Desktop Release

on:
  push:
    branches:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package.json version $version"
          }
      - name: Install dependencies
        run: npm install
      - name: Run tests and build portable executable
        run: |
          npm test
          npm run dist:win
      - name: Publish GitHub Release and portable executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $asset = "release/SecureChat-Desktop-$version-portable.exe"
          if (!(Test-Path $asset)) {
            throw "Expected portable release asset not found: $asset"
          }
          gh release create "${{ github.ref_name }}" $asset --title "SecureChat Desktop ${{ github.ref_name }}" --generate-notes
